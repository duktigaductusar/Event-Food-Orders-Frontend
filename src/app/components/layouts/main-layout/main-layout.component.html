<div class="d-flex flex-column min-vh-100">
	<nav class="navbar navbar-expand-lg navbar-light bg-primary">
		<div class="container-fluid text-white">
			<a class="navbar-brand text-white" [routerLink]="appRoutes.HOME">
				<img
					[src]="'/logo/ductus-white.png'"
					alt="Ductus"
					style="height: 32px"
					class="d-block mx-auto"
				/>
				<span
					class="badge rounded-pill text-bg-info py-1 fs-6 text-uppercase"
				>
					{{ t("navigation.subTitle") }}
				</span>
			</a>

			<div class="d-flex justify-content-center align-items-center gap-4">
				<app-theme-button
					[title]="t('navigation.toggleThemeTooltip')"
				></app-theme-button>

				<app-button-wrapper (selected)="openSidebar(menuTemplate)">
					<i class="bi bi-list fs-1 text-white"></i>
				</app-button-wrapper>
			</div>
		</div>
	</nav>

	<ng-template #menuTemplate let-close="dismiss">
		<div
			class="offcanvas-header d-flex justify-content-between align-items-center w-100 text-light bg-primary border-bottom"
		>
			<h5 class="offcanvas-title text-white">
				{{ t("navigation.menuTitle") }}
			</h5>
			<app-button-wrapper (selected)="close('Closed via button')">
				<i class="bi bi-x-lg fs-3 text-white"></i>
			</app-button-wrapper>
		</div>
		<div class="offcanvas-body bg-primary">
			<ul class="nav flex-column w-100">
				<li
					class="nav-item d-flex align-items-center p-2 w-100 hover-gray"
				>
					<i class="bi bi-house fs-4 text-white"></i>
					<a
						class="nav-link text-white flex-grow-1"
						routerLinkActive="active"
						[routerLink]="appRoutes.HOME"
						(click)="closeSidebar()"
						>{{ t("navigation.homeLink") }}</a
					>
				</li>
				<li
					class="nav-item d-flex align-items-center p-2 w-100 hover-gray"
				>
					<i class="bi bi-plus-circle fs-4 text-white"></i>
					<a
						class="nav-link text-white flex-grow-1"
						routerLinkActive="active"
						[routerLink]="'/' + appRoutes.EVENT_CREATE"
						(click)="closeSidebar()"
						>{{ t("navigation.createEventLink") }}</a
					>
				</li>
				<li
					class="nav-item d-flex align-items-center p-2 w-100 hover-gray"
				>
					<i
						class="bi bi-box-arrow-right fs-4 text-secondary text-white"
					></i>
					<a
						class="nav-link text-white flex-grow-1"
						routerLinkActive="active"
						[routerLink]="'/' + appRoutes.LOGOUT"
						(click)="closeSidebar()"
						>{{ t("navigation.logoutLink") }}</a
					>
				</li>
			</ul>
		</div>
	</ng-template>

	<main class="flex-grow-1 overflow-auto bg-light pt-4">
		<ng-content></ng-content>
	</main>
</div>
