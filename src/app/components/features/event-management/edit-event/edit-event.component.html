@if (isPending()) {
	<app-spinner-full-screen></app-spinner-full-screen>
}
<app-event-form-base
	[form]="computedForm()"
	[initialEvent]="event()"
	(submitEventForm)="submitEdit($event)"
>
	<div extra-header-one class="pb-4 d-flex justify-content-center">
		<app-generic-btn
			[icon]="'stop-circle'"
			[label]="getTitleForEditingForm()"
			[customClass]="
				'w-auto border-0 fs-5 border-bottom pb-0 border-danger rounded-0'
			"
			[borderColor]="'danger'"
			(action)="toggleEdit()"
		>
		</app-generic-btn>
	</div>
	<div extra-header-two class="pb-4 d-flex justify-content-center">
		<app-generic-btn
			[icon]="'stop-circle'"
			[label]="getTitleForEditingForm()"
			[customClass]="
				'w-auto border-0 fs-5  border-bottom pb-0 border-danger rounded-0'
			"
			[borderColor]="'danger'"
			(action)="toggleEdit()"
		>
		</app-generic-btn>
	</div>
	<div extra-header-three class="pb-4 d-flex justify-content-center">
		<app-generic-btn
			[icon]="'stop-circle'"
			[label]="getTitleForEditingForm()"
			[customClass]="
				'w-auto border-0 fs-5  border-bottom pb-0 border-danger rounded-0'
			"
			[borderColor]="'danger'"
			(action)="toggleEdit()"
		>
		</app-generic-btn>
	</div>
</app-event-form-base>
