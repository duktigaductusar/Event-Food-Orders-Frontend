@if (event !== null) {
	<div class="border border-info p-3">
		<div class="modal-header">
			<h4 class="text-success">Event created</h4>
			<button
				type="button"
				class="btn-close"
				aria-label="Close"
				(click)="navigateHomeByDismiss()"
			></button>
		</div>
		<div class="modal-body primary-emphasis">
			<p class="text-primary-emphasis">
				{{ t2("event-create.modal.titel", { title: event.title }) }}
			</p>
			<p class="text-primary-emphasis">
				{{ t2("event-create.modal.date", { title: event.date }) }}
			</p>
			<p class="text-primary-emphasis">
				{{
					t2("event-create.modal.description", {
						title: event.description,
					})
				}}
			</p>
			<div
				class="modal-footer d-flex flex-row justify-content-center gap-2"
			>
				<app-generic-btn
					[label]="'Nytt event'"
					[icon]="'plus-square'"
					[borderColor]="'primary'"
					(click)="navigateCreateNewevent()"
				></app-generic-btn>
				<app-generic-btn
					[label]="'Hantera eventet'"
					[icon]="'pencil'"
					[borderColor]="'primary'"
					(click)="navigateManageEvent(event.id)"
				></app-generic-btn>
				<app-generic-btn
					[label]="'Hem'"
					[icon]="'house'"
					[borderColor]="'primary'"
					(click)="navigateHomeByCancel()"
				></app-generic-btn>
			</div>
		</div>
	</div>
}
