@if (event === null) {
	<div class="border border-danger p-3">
		<div class="modal-header">
			<h4 class="text-danger">
				{{ t("event-management.noEventForDeletion") }}
			</h4>
			<button
				type="button"
				class="btn-close"
				aria-label="Close"
				(click)="activeModal.dismiss('Cross click')"
			></button>
		</div>
	</div>
} @else {
	<div class="border border-info p-3">
		<div class="modal-header">
			<h4 class="text-danger">
				{{ t("event-management.deleteEventPrompt") }}
			</h4>
			<button
				type="button"
				class="btn-close"
				aria-label="Close"
				(click)="activeModal.dismiss('Cross click')"
			></button>
		</div>
		<div class="modal-body">
			<p class="text-primary-emphasis">Titel: {{ event.title }}</p>
			<p class="text-primary-emphasis">
				Description: {{ event.description }}
			</p>
			<p class="text-primary-emphasis">Date: {{ event.date }}</p>
		</div>
		<div class="modal-footer d-flex justify-content-between">
			<app-generic-btn
				[label]="t('event-management.deleteEventButton')"
				[icon]="'x-circle-fill'"
				[borderColor]="'danger'"
				(click)="callDeleteMethod()"
			></app-generic-btn>
			<app-generic-btn
				[label]="t('event-management.abortDeleteButton')"
				[icon]="'x-lg'"
				[borderColor]="'secondary'"
				(click)="activeModal.dismiss('Cancel click')"
			></app-generic-btn>
		</div>
	</div>
}
